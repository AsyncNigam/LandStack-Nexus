# ─────────────────────────────────────────────────────────────────────
# LandStack Nexus — Production Docker Compose
# Deploys the full stack: PostGIS + Backend API + Officer UI + Citizen PWA
# ─────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: landstack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@db:5432/landstack
    ports:
      - "3000:3000"

  # ── Officer Dashboard (Nginx static) ─────────────────────────────
  officer-ui:
    build:
      context: .
      dockerfile: apps/officer-ui/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # ── Citizen PWA (Nginx static) ───────────────────────────────────
  citizen-pwa:
    build:
      context: .
      dockerfile: apps/citizen-pwa/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
